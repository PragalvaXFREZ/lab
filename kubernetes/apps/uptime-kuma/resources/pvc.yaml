apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime
  labels:
    app.kubernetes.io/name: uptime-kuma
    # Longhorn copies this label to the volume and attaches the daily
    # snapshot job declared in recurring-job.yaml.
    recurring-job.longhorn.io/uptime-kuma-daily: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # SQLite database plus retained heartbeat history. Kuma prunes history
      # by its own retention setting, so growth is bounded. Longhorn supports
      # expansion if it is ever needed.
      storage: 1Gi
