# Automation was off at birth, the same drill as every adoption: the root app
# created this child, the first sync was manual (2026-11-05) and verified
# through the LAN Gateway before prune and selfHeal came on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-portal
  namespace: argocd
  labels:
    devata.pragalva.me/tier: workload
spec:
  project: default
  source:
    repoURL: https://github.com/PragalvaXFREZ/lab.git
    targetRevision: main
    path: kubernetes/apps/infra-portal
  destination:
    server: https://kubernetes.default.svc
    namespace: infra-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
