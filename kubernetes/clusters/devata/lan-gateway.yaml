apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lan-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    devata.pragalva.me/tier: platform
spec:
  project: default
  source:
    repoURL: https://github.com/PragalvaXFREZ/lab.git
    targetRevision: main
    path: kubernetes/infra/networking/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      selfHeal: true
      prune: true
