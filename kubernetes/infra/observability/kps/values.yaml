alertmanager:
  enabled: true
  # GOMEMLIMIT follows the container memory limit, so the Go runtime collects
  # garbage before the hard limit instead of being killed at it.
  enableFeatures:
  - auto-gomemlimit
  alertmanagerSpec:
    replicas: 1
    # Routing and receivers live in resources/alertmanager-routing.yaml.
    alertmanagerConfiguration:
      name: alertmanager-routing
      global:
        resolveTimeout: 5m
    # No storage: silences and the notification log live in an emptyDir and
    # are lost when the pod restarts.
    resources:
      limits:
        memory: 96Mi
      requests:
        cpu: 10m
        memory: 32Mi
    # The operator leaves the config reloader without resources by default.
    containers:
    - name: config-reloader
      resources:
        limits:
          memory: 48Mi
        requests:
          cpu: 5m
          memory: 16Mi
    initContainers:
    - name: init-config-reloader
      resources:
        limits:
          memory: 48Mi
        requests:
          cpu: 5m
          memory: 16Mi
defaultRules:
  disabled:
    # Sums every ResourceQuota against node allocatable, so it carries no
    # namespace and cannot be routed by namespace. Today it only measures a
    # practice quota that is not in git. Re-enable when git manages quotas.
    KubeMemoryQuotaOvercommit: true
grafana:
  replicas: 1
  admin:
    existingSecret: grafana-admin
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/Devata/devata-overview.json
    server:
      enable_gzip: false
    security:
      csrf_trusted_origins: grafana.pragalva.me
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - disableDeletion: false
        editable: true
        folder: Cilium
        name: cilium
        options:
          path: /var/lib/grafana/dashboards/cilium
        orgId: 1
        type: file
  dashboards:
    cilium:
      hubble:
        datasource: Prometheus
        gnetId: 16611
        revision: 1
  nodeSelector:
    kubernetes.io/hostname: talos-opt-7040
  persistence:
    enabled: true
    existingClaim: kps-grafana-longhorn
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        allowUiUpdates: false
        foldersFromFilesStructure: true
  service:
    type: LoadBalancer
kube-state-metrics:
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 64Mi
# The control plane targets come from the ScrapeConfigs in resources/, because
# Argo CD excludes Endpoints and never applies the chart's selector-less ones.
# enabled stays true so the chart keeps the rules and dashboards for each
# component; only its Service, Endpoints and ServiceMonitor are turned off.
kubeControllerManager:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false
kubeEtcd:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false
prometheus:
  prometheusSpec:
    initContainers:
    - command:
      - sh
      - -c
      - chown -R 1000:2000 /prometheus && chmod -R g+rwX /prometheus
      image: busybox:1.37
      name: init-chown-data
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
      - mountPath: /prometheus
        name: prometheus-kps-kube-prometheus-stack-prometheus-db
        subPath: prometheus-db
    nodeSelector:
      kubernetes.io/hostname: talos-opt-7040
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      limits:
        memory: 900Mi
      requests:
        cpu: 100m
        memory: 450Mi
    retention: 7d
    retentionSize: 4GiB
    ruleSelectorNilUsesHelmValues: false
    # Opt-in only (not default) so the token is sent only to the control
    # plane ScrapeConfigs that name this class.
    scrapeClasses:
    - name: service-account-token
      authorization:
        credentialsFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: longhorn
prometheus-node-exporter:
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 24Mi
prometheusOperator:
  resources:
    limits:
      memory: 250Mi
    requests:
      cpu: 50m
      memory: 100Mi
