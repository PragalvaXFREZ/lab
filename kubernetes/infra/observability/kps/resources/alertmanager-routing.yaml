# Alertmanager routing, loaded as the global configuration through
# alertmanagerSpec.alertmanagerConfiguration in values.yaml. The operator
# applies no namespace matcher to a global AlertmanagerConfig, and the chart's
# alertmanager.config is not read while this is set.
#
# Only warning and critical alerts reach Discord, through the last route.
# Everything else ends in the null receiver.
#
# The Discord webhook URL is read by the operator from the Secret
# alertmanager-discord-webhook, key url, and written into the generated
# configuration. The operator in chart 86.2.0 does not accept
# webhook_url_file for Discord. If the Secret is missing or its URL is not
# valid, the operator stops reconciling the Alertmanager: a running pod keeps
# its previous configuration, and no pod is created if none exists yet.
#
# Grouping is tuned for one operator reading a phone: one notification per
# alert name and namespace, 1m group_wait so a burst after a restart arrives
# as one message, 10m group_interval so changes to an open group are batched,
# and a 24h repeat so a known problem is a daily reminder, not a stream.
#
# The inhibit rules are the chart's defaults, unchanged.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-routing
  namespace: monitoring
spec:
  route:
    receiver: "null"
    groupBy:
      - alertname
      - namespace
    groupWait: 1m
    groupInterval: 10m
    repeatInterval: 24h
    routes:
      # Watchdog always fires and InfoInhibitor exists only to inhibit info
      # alerts; neither is a notification.
      - receiver: "null"
        matchers:
          - name: alertname
            matchType: "=~"
            value: Watchdog|InfoInhibitor
      # Hand-made practice namespaces that are not managed in git. Their
      # failures are expected and say nothing about the platform. default is
      # left out on purpose: the apiserver targets carry namespace="default".
      - receiver: "null"
        matchers:
          - name: namespace
            matchType: "=~"
            value: dev|bootcamp|example-namespace|networking-namespace
      # Delivery route. Info and none severities stay on the root null
      # receiver.
      - receiver: discord
        matchers:
          - name: severity
            matchType: "=~"
            value: warning|critical
  receivers:
    - name: "null"
    # Title: status, alert name and severity. Body: namespace, the common
    # summary, then one line per alert, marked when resolved. Discord limits
    # the title to 256 and the body to 4096 characters; Alertmanager
    # truncates longer text.
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: url
          sendResolved: true
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}{{ with .CommonLabels.severity }} ({{ . }}){{ end }}
          message: |-
            {{ with .CommonLabels.namespace }}Namespace: {{ . }}
            {{ end }}{{ with .CommonAnnotations.summary }}{{ . }}
            {{ end }}{{ range .Alerts }}
            - {{ if eq .Status "resolved" }}[resolved] {{ end }}{{ with .Annotations.description }}{{ . }}{{ else }}{{ .Annotations.summary }}{{ end }}{{ end }}
  inhibitRules:
    - sourceMatch:
        - name: severity
          matchType: "="
          value: critical
      targetMatch:
        - name: severity
          matchType: "=~"
          value: warning|info
      equal:
        - namespace
        - alertname
    - sourceMatch:
        - name: severity
          matchType: "="
          value: warning
      targetMatch:
        - name: severity
          matchType: "="
          value: info
      equal:
        - namespace
        - alertname
    - sourceMatch:
        - name: alertname
          matchType: "="
          value: InfoInhibitor
      targetMatch:
        - name: severity
          matchType: "="
          value: info
      equal:
        - namespace
    - targetMatch:
        - name: alertname
          matchType: "="
          value: InfoInhibitor
