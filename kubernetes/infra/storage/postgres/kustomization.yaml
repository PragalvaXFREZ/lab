apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sealedsecret-backup-s3.yaml
  - sealedsecret-backup-recipient.yaml
  - sealedsecret-backup-role.yaml
  - cluster.yaml
  - pod-monitor.yaml
  - network-policy.yaml
  - backup-cronjob.yaml
  - bucket-usage-cronjob.yaml
  - prometheus-rule.yaml
configMapGenerator:
  - name: postgres-backup-scripts
    namespace: postgres
    files:
      - backup/dump.sh
      - backup/upload.sh
      - backup/bucket-usage.sh
    options:
      disableNameSuffixHash: true
