persistence:
  createStorageClass: true
  defaultClass: false
  defaultClassReplicaCount: 2
  dataEngine: v1

preUpgradeChecker:
  jobEnabled: false

csi:
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2

defaultSettings:
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/mnt/longhorn
  defaultReplicaCount: '{"v1":"2","v2":"2"}'
  v1DataEngine: true
  v2DataEngine: false

longhornUI:
  replicas: 1

# The ServiceMonitor CRD comes from kps. Skipping the dry run keeps a fresh
# cluster able to install Longhorn before kps exists.
metrics:
  serviceMonitor:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    metricRelabelings:
      # Per-replica, per-engine, and controller internals scale with volume
      # count and are not used by any dashboard or rule here.
      - sourceLabels: [__name__]
        regex: longhorn_(replica|engine)_.+|longhorn_workqueue_.+|longhorn_rest_client_.+
        action: drop

# Run the manager only on nodes that hold a Longhorn disk. A node without the
# iscsi-tools Talos extension cannot pass the manager environment check.
longhornManager:
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
