persistence:
  createStorageClass: true
  defaultClass: false
  defaultClassReplicaCount: 2
  dataEngine: v1

preUpgradeChecker:
  jobEnabled: false

csi:
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2

defaultSettings:
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/mnt/longhorn
  defaultReplicaCount: '{"v1":"2","v2":"2"}'
  v1DataEngine: true
  v2DataEngine: false

longhornUI:
  replicas: 1

# Run the manager only on nodes that hold a Longhorn disk. A node without the
# iscsi-tools Talos extension cannot pass the manager environment check.
longhornManager:
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
