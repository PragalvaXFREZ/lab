apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime
  labels:
    app.kubernetes.io/name: uptime-kuma
    # The source label tells Longhorn to treat this PVC as the authority for
    # the volume's recurring jobs and to sync the job labels below onto the
    # volume periodically. Without it the job label is inert.
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/uptime-kuma-daily: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # SQLite database plus retained heartbeat history. Kuma prunes history
      # by its own retention setting, so growth is bounded. Longhorn supports
      # expansion if it is ever needed.
      storage: 1Gi
