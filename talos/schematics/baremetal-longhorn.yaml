# Talos Image Factory schematic for storage-capable Intel bare-metal workers.
# NetBird runs as a Talos extension service so recovery access does not depend
# on Kubernetes, the CNI, or another machine on the LAN.
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/intel-ucode
      - siderolabs/iscsi-tools
      - siderolabs/netbird
      - siderolabs/util-linux-tools

