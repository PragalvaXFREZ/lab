# Talos Image Factory schematic for the Acer Nitro 5 worker.
# The NVIDIA LTS extension resolves to the branch supported by the selected
# Talos release. NetBird runs below Kubernetes for independent recovery access.
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/nonfree-kmod-nvidia-lts
      - siderolabs/nvidia-container-toolkit-lts
      - siderolabs/iscsi-tools
      - siderolabs/netbird
      - siderolabs/util-linux-tools

