# Machine-specific patch for the Dell OptiPlex 7040 worker.
# Apply this to a current devata worker configuration kept outside Git.
machine:
  nodeLabels:
    node-role.kubernetes.io/worker: ""
    node.longhorn.io/create-default-disk: "true"
  install:
    disk: /dev/nvme0n1
    image: factory.talos.dev/metal-installer/f141fc2a08d5a459a80d871faa48d7dc92bc354e4faf6cdbafe1cc0fac717991:v1.12.11
    wipe: false
  kubelet:
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
  network:
    hostname: talos-opt-7040
    interfaces:
      - interface: enp0s31f6
        addresses:
          - 192.168.1.10/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        dhcp: false
    nameservers:
      - 192.168.1.1
      - 1.1.1.1
  registries:
    mirrors:
      192.168.1.13:5000:
        endpoints:
          - http://192.168.1.13:5000
cluster:
  controlPlane:
    endpoint: https://192.168.1.8:6443
