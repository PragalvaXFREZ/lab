# Machine-specific patch for the Dell OptiPlex 7040 control plane node.
# Apply this to a devata control plane configuration kept outside Git,
# after the node-specific fields of the source node are removed.
# The node also runs workloads and keeps its Longhorn disk.
machine:
  nodeLabels:
    node-role.kubernetes.io/worker: ""
    node.longhorn.io/create-default-disk: "true"
  install:
    disk: /dev/nvme0n1
    image: factory.talos.dev/metal-installer/f141fc2a08d5a459a80d871faa48d7dc92bc354e4faf6cdbafe1cc0fac717991:v1.12.11
    wipe: false
  kubelet:
    nodeIP:
      validSubnets:
        - 192.168.1.0/24
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
  network:
    hostname: talos-opt-7040
    interfaces:
      - interface: enp0s31f6
        addresses:
          - 192.168.1.10/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        dhcp: false
        vip:
          ip: 192.168.1.2
    nameservers:
      - 192.168.1.1
      - 1.1.1.1
  registries:
    mirrors:
      192.168.1.13:5000:
        endpoints:
          - http://192.168.1.13:5000
cluster:
  allowSchedulingOnControlPlanes: true
  controlPlane:
    endpoint: https://192.168.1.2:6443
  apiServer:
    certSANs:
      - 192.168.1.2
      - 192.168.1.10
      - talos-opt-7040
  etcd:
    advertisedSubnets:
      - 192.168.1.0/24
